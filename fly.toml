# SVA Platform — API on Fly.io
# Run `fly launch --no-deploy --copy-config` to create the app, then `fly deploy`

app = "sva-platform-api"
primary_region = "iad"   # US East (Ashburn, VA) — closest to Walmart's US infra

[build]
  dockerfile = "apps/api/Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "4000"

[http_service]
  internal_port = 4000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512
